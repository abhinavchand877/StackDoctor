services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secure_pass_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-stackdoctor_db}
      MYSQL_USER: ${MYSQL_USER:-stack_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-stack_secure_pass_2026}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - stackdoctor_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis In-Memory Cache & Queue Service
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - stackdoctor_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      FLASK_ENV: production
      PORT: 5000
      SECRET_KEY: ${SECRET_KEY:-stackdoctor_prod_secret_key_8899}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-stackdoctor_prod_jwt_key_7766}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-stack_user}:${MYSQL_PASSWORD:-stack_secure_pass_2026}@mysql:3306/${MYSQL_DATABASE:-stackdoctor_db}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      MAX_UPLOAD_SIZE_BYTES: 52428800
      MAX_EXTRACTED_SIZE_BYTES: 157286400
      MAX_ARCHIVE_ENTRIES: 3000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/tmp
    networks:
      - stackdoctor_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Celery Background Worker Service
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.tasks.celery_app.celery worker --loglevel=info
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:-stackdoctor_prod_secret_key_8899}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-stackdoctor_prod_jwt_key_7766}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-stack_user}:${MYSQL_PASSWORD:-stack_secure_pass_2026}@mysql:3306/${MYSQL_DATABASE:-stackdoctor_db}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "app.tasks.celery_app.celery", "inspect", "ping"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - stackdoctor_net
    volumes:
      - uploads_data:/app/tmp

  # Nginx Production Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - stackdoctor_net

volumes:
  mysql_data:
    driver: local
  uploads_data:
    driver: local

networks:
  stackdoctor_net:
    driver: bridge

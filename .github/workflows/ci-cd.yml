name: StackDoctor CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================================
  # STAGE 1: BACKEND TESTS
  # ========================================================
  backend-tests:
    name: Backend Test Suite (Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate Backend Configuration & Module Imports
        run: |
          cd backend
          python -c "from app import create_app; app = create_app('testing'); print('Backend application factory and modules validated successfully.')"

      - name: Execute Backend Tests
        run: |
          cd backend
          pytest -v --tb=short

  # ========================================================
  # STAGE 2: FRONTEND TESTS & PRODUCTION BUILD
  # ========================================================
  frontend-tests:
    name: Frontend Test Suite & Bundle Build (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Run Frontend Tests
        working-directory: frontend
        run: npm test -- --run

      - name: Run Production Bundle Build
        working-directory: frontend
        run: npm run build

  # ========================================================
  # STAGE 3: DOCKER IMAGE BUILD VALIDATION
  # ========================================================
  docker-validation:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Backend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: stackdoctor-backend:test

      - name: Validate Frontend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: stackdoctor-frontend:test

  # ========================================================
  # STAGE 4: PUBLISH CONTAINER IMAGES (GHCR)
  # ========================================================
  publish-images:
    name: Publish Container Images (GHCR)
    runs-on: ubuntu-latest
    needs: [docker-validation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        id: repo-name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo-name.outputs.REPO }}/backend:latest
            ghcr.io/${{ steps.repo-name.outputs.REPO }}/backend:${{ github.sha }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo-name.outputs.REPO }}/frontend:latest
            ghcr.io/${{ steps.repo-name.outputs.REPO }}/frontend:${{ github.sha }}

  # ========================================================
  # STAGE 5: AUTOMATED PRODUCTION DEPLOYMENT
  # ========================================================
  deploy:
    name: Production Deployment (Docker Compose / SSH)
    runs-on: ubuntu-latest
    needs: [publish-images]
    # Gated strictly on successful push to main and repository secret/variable
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure SSH Credentials
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "$KNOWN_HOSTS" >> ~/.ssh/known_hosts

      - name: Execute Remote Deployment via SSH
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh ${USER}@${HOST} "
            set -e
            cd /opt/stackdoctor
            git pull origin main
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps
          "
